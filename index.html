<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LeoJStudyLens — AI Study Assistant</title>
  <meta name="description" content="AI-powered study notes, flashcards and chat tutor." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%237c3aed'/%3E%3Ctext x='50' y='62' text-anchor='middle' fill='white' font-size='48' font-family='Inter, Arial' font-weight='700'%3EL%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { ai: {50:'#f7f7ff',100:'#eef2ff',300:'#a78bfa',500:'#7c3aed',700:'#6d28d9'} } } } };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root { --glass: rgba(255,255,255,0.6); --glass-dark: rgba(15,23,42,0.6); }
    html,body { height:100%; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .accent { background: linear-gradient(90deg,#7c3aed 0%,#ec4899 100%); }
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6)); backdrop-filter: blur(8px); }
    .dark .card { background: linear-gradient(180deg, rgba(17,24,39,0.6), rgba(17,24,39,0.5)); }
    .avatar { width:36px; height:36px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-weight:700 }
    .msg-user { background: linear-gradient(90deg,#6366f1,#f43f5e); color:white }
    .msg-assistant { background: var(--glass); }
    .typing { width:10px; height:10px; border-radius:50%; display:inline-block; margin:0 2px; opacity:0.8; }
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0%{ transform: translateY(0) } 50%{ transform: translateY(-4px) } 100%{ transform: translateY(0) } }
    .scrollbar::-webkit-scrollbar { width:8px } .scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius:8px }
  </style>
</head>
<body class="h-full bg-gradient-to-br from-ai-50 via-white to-slate-100 dark:from-slate-900 dark:via-slate-950 dark:to-black text-slate-800 dark:text-slate-100">

  <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <!-- Left column: controls + material -->
    <aside class="lg:col-span-4 space-y-6">
      <div class="card rounded-2xl p-4 shadow-lg border border-slate-200/30 dark:border-slate-800/40">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-lg accent text-white flex items-center justify-center shadow-md"><i class="fa-solid fa-graduation-cap"></i></div>
            <div>
              <h1 class="text-lg font-bold">LeoJStudyLens</h1>
              <p class="text-xs text-slate-500 dark:text-slate-400">AI Study Notes & Tutor</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button id="themeToggleTop" class="w-9 h-9 rounded-lg bg-white/80 dark:bg-slate-800 flex items-center justify-center border border-slate-200 dark:border-slate-700"><i id="themeIconTop" class="fa-solid fa-moon text-sm"></i></button>
            <button id="openChatDock" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm hover:brightness-105">Open Tutor</button>
          </div>
        </div>

        <div class="mt-4">
          <label class="text-xs uppercase text-slate-500 font-semibold">Language</label>
          <select id="langSelectMain" class="mt-2 w-full rounded-md p-2 text-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
        </div>
      </div>

      <div class="card rounded-2xl p-4 shadow-lg border border-slate-200/30 dark:border-slate-800/40">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="font-bold">Study Material</h3>
            <p class="text-xs text-slate-500">Paste text or upload notes below</p>
          </div>
          <div class="text-xs text-slate-400" id="statsMini">0 words</div>
        </div>

        <textarea id="sourceText" rows="10" class="mt-3 w-full rounded-md p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm resize-y" placeholder="Paste study material here..."></textarea>

        <div class="mt-3 grid grid-cols-2 gap-2">
          <select id="formatSelectMain" class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm">
            <option value="bullets">Bullets</option>
            <option value="definitions">Definitions</option>
            <option value="summary">Summary</option>
            <option value="exam">Flashcards</option>
          </select>
          <select id="concisenessMain" class="rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm">
            <option value="balanced">Balanced</option>
            <option value="ultra">Ultra-short</option>
            <option value="comprehensive">Comprehensive</option>
          </select>
        </div>

        <div class="mt-4 flex items-center gap-2 justify-between">
          <div class="flex items-center gap-2">
            <label class="inline-flex items-center text-xs"><input id="includeInChat" type="checkbox" checked class="mr-2">Attach to chat</label>
          </div>
          <div class="flex items-center gap-2">
            <button id="clearBtn" class="text-rose-500 text-sm">Clear</button>
            <button id="generateBtnMain" class="px-4 py-2 rounded-lg bg-gradient-to-r from-indigo-600 to-pink-500 text-white text-sm shadow-md">Generate</button>
          </div>
        </div>
      </div>

      <div class="card rounded-2xl p-4 shadow-lg border border-slate-200/30 dark:border-slate-800/40">
        <h4 class="font-bold">Quick Tools</h4>
        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="flashcardBtn" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm">Create Flashcards</button>
          <button id="quizBtn" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm">Create Quiz</button>
          <button id="keywordsBtn" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm">Extract Keywords</button>
          <button id="examplesBtn" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm">Generate Examples</button>
        </div>
      </div>
    </aside>

    <!-- Right column: chat and results -->
    <main class="lg:col-span-8 space-y-6">
      <div class="card rounded-2xl p-4 shadow-xl border border-slate-200/30 dark:border-slate-800/40">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-bold text-lg">Study Tutor</h2>
            <p class="text-xs text-slate-500">Ask questions, get summaries and practice with flashcards</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="downloadTxtBtnMain" class="px-3 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-sm">.TXT</button>
            <button id="downloadHtmlBtnMain" class="px-3 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-sm">.HTML</button>
            <button id="copyBtnMain" class="px-3 py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-sm"><i class="fa-regular fa-copy"></i></button>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="lg:col-span-2 border border-slate-200/30 dark:border-slate-800/40 rounded-lg p-3 max-h-[460px] overflow-y-auto scrollbar">
            <div id="resultContentMain" class="prose text-sm text-slate-700 dark:text-slate-200"></div>
          </div>

          <div class="rounded-lg p-3 border border-slate-200/30 dark:border-slate-800/40">
            <h4 class="font-semibold">Conversation</h4>
            <div id="chatDock" class="mt-3 space-y-3 max-h-[360px] overflow-y-auto scrollbar"></div>
            <div class="mt-3">
              <textarea id="chatInputDock" rows="2" class="w-full rounded-md p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm" placeholder="Ask the tutor..."></textarea>
              <div class="mt-2 flex items-center justify-between">
                <div class="text-xs text-slate-400">Model: <span id="modelLabel">gpt-4o-mini</span></div>
                <div class="flex items-center gap-2">
                  <button id="sendDockBtn" class="px-3 py-1 rounded-lg bg-indigo-600 text-white text-sm">Send</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="text-xs text-slate-400 text-center">Built with ❤️ — LeoJStudyLens (demo mode available until backend configured)</footer>
    </main>
  </div>

  <script>
    // Basic UI wiring + enhanced chat rendering
    const themeToggleTop = document.getElementById('themeToggleTop');
    const themeIconTop = document.getElementById('themeIconTop');
    const root = document.documentElement;

    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      root.classList.add('dark'); themeIconTop.className = 'fa-solid fa-sun text-sm';
    } else { root.classList.remove('dark'); themeIconTop.className = 'fa-solid fa-moon text-sm'; }

    themeToggleTop.addEventListener('click', () => {
      if (root.classList.contains('dark')) { root.classList.remove('dark'); localStorage.theme = 'light'; themeIconTop.className = 'fa-solid fa-moon text-sm'; }
      else { root.classList.add('dark'); localStorage.theme = 'dark'; themeIconTop.className = 'fa-solid fa-sun text-sm'; }
    });

    // Elements
    const sourceText = document.getElementById('sourceText');
    const statsMini = document.getElementById('statsMini');
    const generateBtnMain = document.getElementById('generateBtnMain');
    const resultContentMain = document.getElementById('resultContentMain');
    const formatSelectMain = document.getElementById('formatSelectMain');
    const concisenessMain = document.getElementById('concisenessMain');
    const includeInChat = document.getElementById('includeInChat');
    const chatDock = document.getElementById('chatDock');
    const chatInputDock = document.getElementById('chatInputDock');
    const sendDockBtn = document.getElementById('sendDockBtn');

    function updateStats(){
      const text = sourceText.value || '';
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      statsMini.textContent = `${words.toLocaleString()} words`;
    }
    sourceText.addEventListener('input', updateStats);

    // Chat history storage
    function loadHistory(){ try { return JSON.parse(localStorage.getItem('lj_chat')||'[]'); } catch(e){ return []; } }
    function saveHistory(h){ localStorage.setItem('lj_chat', JSON.stringify(h)); }

    function renderChatDock(){
      const history = loadHistory();
      chatDock.innerHTML = '';
      history.forEach(m => {
        const el = document.createElement('div');
        el.className = 'flex gap-3 items-start';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.style.background = m.role==='user' ? 'linear-gradient(90deg,#6366f1,#f43f5e)' : 'transparent';
        avatar.style.color = m.role==='user' ? 'white' : 'inherit';
        avatar.textContent = m.role==='user' ? 'You' : 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'p-3 rounded-xl';
        bubble.style.background = m.role==='user' ? 'linear-gradient(90deg,#6366f1,#f43f5e)' : (root.classList.contains('dark') ? 'rgba(255,255,255,0.03)' : 'rgba(15,23,42,0.03)');
        bubble.style.color = m.role==='user' ? 'white' : '';
        bubble.innerHTML = `<div class="text-sm">${escapeHtml(m.content).replace(/\n/g,'<br>')}</div><div class="text-[10px] text-slate-400 mt-1">${new Date(m.ts).toLocaleTimeString()}</div>`;
        el.appendChild(avatar);
        el.appendChild(bubble);
        chatDock.appendChild(el);
      });
      chatDock.scrollTop = chatDock.scrollHeight;
    }

    function pushMessage(role, content){
      const h = loadHistory(); h.push({ role, content, ts: Date.now() }); saveHistory(h); renderChatDock(); }

    // Escape for safe innerHTML
    function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // Fallback demo engine (when no backend available) - simple streaming illusion
    function streamTextSim(text, onChunk, onDone){
      const tokens = text.split(/(\s+)/).filter(Boolean);
      let i=0; const interval = setInterval(()=>{ i++; onChunk(tokens.slice(0,i).join('')); if(i>=tokens.length){ clearInterval(interval); onDone(text); } }, 18);
    }

    async function callBackend(messages, model, onChunk, onDone, onError){
      try{
        const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ model, messages }) });
        if(!res.ok) throw new Error('Backend not available');
        const data = await res.json();
        const text = data?.choices?.[0]?.message?.content || data?.output || 'No response';
        onDone(text);
      }catch(e){
        // demo fallback
        const fallback = buildFallback(messages);
        streamTextSim(fallback, onChunk, onDone);
      }
    }

    function buildFallback(messages){
      const last = [...messages].reverse().find(m=>m.role==='user')?.content || '';
      return `Demo Tutor Response for: ${last}\n\n• Main idea: ...\n• Key facts: ...\n• Example: ...\n\n(Connect a backend to run the real model)`;
    }

    // Sending chat from dock
    async function sendDock(){
      const text = chatInputDock.value.trim(); if(!text) return; chatInputDock.value=''; pushMessage('user', text);
      // create assistant placeholder
      const placeholder = '…'; pushMessage('assistant', placeholder);

      const history = loadHistory();
      const messages = history.map(h=>({ role:h.role, content:h.content }));
      const model = document.getElementById('modelLabel').textContent || 'gpt-4o-mini';

      let partial = '';
      await callBackend(messages, model, (chunk)=>{
        // replace last assistant
        const h = loadHistory(); h[h.length-1].content = chunk; saveHistory(h); renderChatDock();
      }, (full)=>{
        // final
        const h = loadHistory(); h[h.length-1].content = full; saveHistory(h); renderChatDock();
      }, (err)=>{ showToast(err || 'Error'); });
    }

    sendDockBtn.addEventListener('click', sendDock);
    chatInputDock.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendDock(); } });

    // Generate notes from material
    generateBtnMain.addEventListener('click', async ()=>{
      const material = sourceText.value.trim(); if(!material){ showToast('Add material first'); return; }
      resultContentMain.innerHTML = '<div class="text-sm text-slate-400">Generating…</div>';
      const messages = [ { role:'system', content:'You are a study note summarizer.' }, { role:'user', content:`Generate ${formatSelectMain.value} notes at ${concisenessMain.value} level in target language. Material:\n\n${material}` } ];
      await callBackend(messages, 'gpt-4o-mini', (chunk)=>{ resultContentMain.innerHTML = '<div class="prose">'+chunk.replace(/\n/g,'<br>')+'</div>'; }, (full)=>{ resultContentMain.innerHTML = '<div class="prose">'+full.replace(/\n/g,'<br>')+'</div>'; pushMessage('assistant', full); }, (err)=>{ resultContentMain.innerHTML = `<div class='text-rose-500'>Error: ${err}</div>`; });
    });

    // Simple toast
    const toast = document.getElementById('toast'); function showToast(msg){ document.getElementById('toastMsg').textContent = msg; toast.classList.remove('translate-y-20','opacity-0'); setTimeout(()=>toast.classList.add('translate-y-20','opacity-0'),3000); }

    // Copy / download
    document.getElementById('copyBtnMain').addEventListener('click', ()=>{ const t = resultContentMain.innerText || ''; if(!t) return; navigator.clipboard.writeText(t); showToast('Copied'); });
    document.getElementById('downloadTxtBtnMain').addEventListener('click', ()=>{ const t = resultContentMain.innerText || ''; if(!t) return; const b=new Blob([t],{type:'text/plain'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='notes.txt'; a.click(); URL.revokeObjectURL(u); });
    document.getElementById('downloadHtmlBtnMain').addEventListener('click', ()=>{ const html = `<!doctype html><html><head><meta charset="utf-8"><title>Notes</title></head><body>${resultContentMain.innerHTML}</body></html>`; const b=new Blob([html],{type:'text/html'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='notes.html'; a.click(); URL.revokeObjectURL(u); });

    // Init
    renderChatDock(); updateStats();

  </script>
</body>
</html>
